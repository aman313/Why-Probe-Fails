# Activation-sequence probe pipeline — default config (dev: distilgpt2, RS1)
seed: 42

# Data: CSV layout under data_dir, labels from folder
data:
  data_dir: data/RS1
  categories: [benign, malicious]
  label_map:
    benign: 0
    malicious: 1
  split_by_file: false
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  limit_docs: null  # set to int for quick runs

# Base LM (whose activations we extract). Switch by changing base_model_name (e.g. gpt2, distilgpt2, meta-llama/Llama-3.1-8B-Instruct).
# cache_dir: use a path inside the repo (e.g. .cache/huggingface) if ~/.cache has permission issues.
model:
  base_model_name: Qwen/Qwen2.5-3B-Instruct
  cache_dir: .cache/huggingface
  layer_index: 3
  tap_point: resid_post  # resid_post | resid_pre | mlp_out

# Extraction
extraction:
  max_seq_len: 256
  stride: 128
  chunk_size: 10  # max sequence chunks to hold in memory before processing
  batch_size: 5    # GPU batch size for model forward (activations written per batch)
  activation_dtype: float32
  memmap_dir: outputs/activations
  limit_docs: 100000 #null

# Layer search: which layers to try, metric to pick best
layer_search:
  layer_search_metric: macro_f1
  layer_search_output: outputs/best_layer.json

# ActFormer
actformer:
  d_model: 1024
  n_layers: 4
  n_heads: 4
  dropout: 0.1
  ff_mult: 4
  objective: next_token  # next_token | mlm
  loss_type: mse  # mse | gaussian_nll
  normalization: standardize_per_dim  # layernorm | standardize_per_dim
  causal: true  # true for next_token, false for mlm
  mlm_mask_ratio: 0.15  # fraction of positions masked (mlm only)
  min_subseq_len: 2
  max_subseq_len: 256
  augment:
    noise_std: 0.0
    input_dropout: 0.0

pretrain:
  # Optional: separate pretrain dataset and where to store its activations.
  # If memmap_dir is set, ActFormer train uses activations from here (at best layer).
  memmap_dir: outputs/activations_pretrain  # e.g. outputs/activations_pretrain when using separate pretrain data
  data:  # used by extraction --for_pretrain
    data_dir: data/tinystories
    categories: [text]
    label_map: { text: 0 }
    train_ratio: 0.98
    val_ratio: 0.015
    test_ratio: 0.005
    split_by_file: false
    limit_docs: null
  lr: 1e-3
  wd: 0.01
  epochs: 5
  batch_size: 128
  grad_clip: 1.0
  warmup_steps: 100
  eval_every: 200
  save_every: 500
  max_steps: null  # override to limit steps (e.g. 50 for tests)
  output_dir: outputs/actformer

# Probe (classifier trained on pooled activations). linear | mlp | transformer (transformer = from scratch).
probe:
  pooling: mean  # last | mean | attention_pool
  probe_model: linear  # linear | mlp | transformer
  transformer_probe:  # used when probe_model: transformer
    d_model: 256
    n_layers: 2
    n_heads: 4
    ff_mult: 4
    dropout: 0.1
    pool: mean
  probe_train:
    lr: 1e-3
    epochs: 50
    batch_size: 32
    l2: 0.01
  augment:
    noise_std: 0.0
    mixup_alpha: 0.0
  baselines_on_raw_activations: true

# Probe comparison (ID vs OOD) — paths filled after extraction
comparison:
  activations:
    id:
      memmap_dir: outputs/activations/id
      index_path: outputs/activations/id/index.json
    ood:
      - name: dolly
        memmap_dir: outputs/activations_ood/dolly/layer_3
      - name: harmbench
        memmap_dir: outputs/activations_ood/harmbench/layer_3
      - name: advbench
        memmap_dir: outputs/activations_ood/advbench/layer_3     
    
  actformer_checkpoint: outputs/actformer/best.pt
  probe_types: [raw_linear, raw_mlp, actformer_finetuned]
  actformer_finetune:
    lr: 1e-4
    epochs: 10
    batch_size: 16
    freeze_body: false
    pooling: mean
    l2: 0.01
    grad_clip: 1.0
    # LoRA (use_lora: true to train adapter + head only; merged into checkpoint at save)
    use_lora: false
    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    # lora_target_modules: [input_proj, out_proj, linear1, linear2]  # default in code
  pooling: mean
  probe_train:
    lr: 1e-3
    epochs: 50
    batch_size: 32
    l2: 0.01
  metrics: [accuracy, macro_f1, auroc]
  output_dir: outputs/probe_comparison


# Token-level eval: compare baseline LM vs ActFormer-replaced early layers
token_eval:
  split: test
  max_docs: 200
  max_seq_len: 256
  batch_size: 4
  topk_values: [5, 10]
  save_examples: 200
  output_dir: outputs/actformer_token_eval
  normalization_memmap_dir: null
  actformer_checkpoint: null

# Weights & Biases (optional). Set WANDB_API_KEY in .env at repo root to enable.
wandb:
  pretrain_project: actformer-pretrain
  probe_project: probe-train
  comparison_project: probe-comparison
  entity: null
