# TinyStories pretrain: probe = RS1, pretrain = TinyStories (pretrain.memmap_dir set)
seed: 42

# Data: probe dataset for layer search (RS1)
data:
  data_dir: data/RS1
  categories: [benign, malicious]
  label_map:
    benign: 0
    malicious: 1
  split_by_file: false
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  limit_docs: null  # set to int for quick runs

model:
  base_model_name: distilgpt2
  cache_dir: .cache/huggingface
  layer_index: 3
  tap_point: resid_post

extraction:
  max_seq_len: 256
  stride: 128
  batch_size_extract: 8
  activation_dtype: float32
  memmap_dir: outputs/activations
  limit_docs: null
  chunk_docs: 5000  # chunked extraction to avoid OOM on full TinyStories

layer_search:
  layer_search_layers: [0, 1, 2, 3, 4, 5]
  layer_search_metric: macro_f1
  layer_search_output: outputs/best_layer.json

actformer:
  d_model: 256
  n_layers: 2
  n_heads: 4
  dropout: 0.1
  ff_mult: 4
  objective: next_token
  loss_type: gaussian_nll
  normalization: standardize_per_dim
  causal: true
  mlm_mask_ratio: 0.15
  min_subseq_len: 2
  max_subseq_len: 256
  augment:
    noise_std: 0.0
    input_dropout: 0.0

pretrain:
  memmap_dir: outputs/activations_pretrain
  data:
    data_dir: data/tinystories
    categories: [text]
    label_map: { text: 0 }
    train_ratio: 0.98
    val_ratio: 0.015
    test_ratio: 0.005
    split_by_file: false
    limit_docs: null
  lr: 1e-4
  wd: 0.01
  epochs: 3
  batch_size: 32
  grad_clip: 1.0
  warmup_steps: 100
  eval_every: 200
  save_every: 500
  max_steps: null
  output_dir: outputs/actformer

probe:
  pooling: mean
  probe_model: linear
  transformer_probe:
    d_model: 256
    n_layers: 2
    n_heads: 4
    ff_mult: 4
    dropout: 0.1
    pool: mean
  probe_train:
    lr: 1e-3
    epochs: 50
    batch_size: 32
    l2: 0.01
  augment:
    noise_std: 0.0
    mixup_alpha: 0.0
  baselines_on_raw_activations: true

comparison:
  activations:
    id:
      memmap_dir: outputs/activations/id
      index_path: outputs/activations/id/index.json
    ood: []
  actformer_checkpoint: outputs/actformer/best.pt
  probe_types: [raw_linear, raw_mlp, actformer_finetuned]
  actformer_finetune:
    lr: 1e-4
    epochs: 10
    batch_size: 16
    freeze_body: false
    pooling: mean
    l2: 0.01
    grad_clip: 1.0
  pooling: mean
  probe_train:
    lr: 1e-3
    epochs: 50
    batch_size: 32
    l2: 0.01
  metrics: [accuracy, macro_f1, auroc]
  output_dir: outputs/probe_comparison

wandb:
  pretrain_project: actformer-pretrain
  probe_project: probe-train
  comparison_project: probe-comparison
  entity: null
